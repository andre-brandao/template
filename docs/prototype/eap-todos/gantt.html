<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EAP todos — timeline with dependencies</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f7f5, #111110);
        --surface: light-dark(#ffffff, #181817);
        --surface-2: light-dark(#f2f1ee, #222220);
        --border: light-dark(#e6e5e1, #2a2927);
        --border-bright: light-dark(#d3d1cc, #3b3a37);
        --ink: light-dark(#1c1b19, #ecebe7);
        --muted: light-dark(#64625d, #a3a19b);
        --dim: light-dark(#75736d, #8a8882);
        --accent: light-dark(#2f7f68, #4fa98f);
        --accent-ink: light-dark(#ffffff, #0d1110);
        --primary: var(--ink);
        --primary-ink: light-dark(#ffffff, #111110);
        --hover: color-mix(in oklab, var(--ink) 6%, transparent);
        --selected: color-mix(in oklab, var(--accent) 14%, transparent);
        --pending: light-dark(#6b6a64, #8b8a84);
        --progress: light-dark(#a3672a, #c98a3f);
        --done: light-dark(#2f7f68, #4fa98f);
        --danger: light-dark(#b8452c, #d3684f);
        --radius: 8px;
        --radius-sm: 6px;
        --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
        --shadow-2:
          0 16px 32px -12px light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.6)),
          0 0 0 1px light-dark(rgb(0 0 0 / 0.04), rgb(255 255 255 / 0.04));
        --planned: color-mix(in oklab, var(--accent) 26%, var(--surface));
        --late: color-mix(in oklab, var(--danger) 26%, var(--surface));
        --label: 400px;
        --row: 44px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 var(--font-sans);
      }
      main {
        padding: 20px 24px 28px;
      }
      .crumb {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 10px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        font-size: 19px;
        margin: 0;
        flex: 1;
      }
      .seg {
        display: flex;
        background: var(--surface-2);
        border-radius: var(--radius);
        padding: 3px;
        gap: 2px;
      }
      .seg span {
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        color: var(--muted);
      }
      .seg span.on {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--border);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .primary {
        background: var(--primary);
        color: var(--primary-ink);
        border: 0;
        border-radius: var(--radius-sm);
        padding: 7px 12px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 0;
      }
      .toggle {
        border: 1px solid var(--border-bright);
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 5px 10px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .toggle[aria-pressed="true"] {
        background: var(--selected);
        border-color: var(--accent);
      }
      .toolbar .meta {
        margin-left: auto;
        font: 11px var(--font-mono);
        color: var(--dim);
      }
      .hint {
        font-size: 12px;
        color: var(--accent);
      }
      .frame {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: auto;
        position: relative;
      }
      .grid {
        position: relative;
        width: max-content;
      }
      .head,
      .row {
        display: flex;
      }
      .head {
        position: sticky;
        top: 0;
        z-index: 4;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        height: 32px;
      }
      .cell {
        width: var(--label);
        flex: none;
        position: sticky;
        left: 0;
        z-index: 3;
        background: var(--surface);
        border-right: 1px solid var(--border);
      }
      .head .cell {
        background: var(--surface-2);
        font: 10px var(--font-mono);
        color: var(--dim);
        padding: 10px 12px;
      }
      .weeks {
        position: relative;
        flex: none;
      }
      .weeks span {
        position: absolute;
        top: 10px;
        font: 10px var(--font-mono);
        color: var(--dim);
        padding-left: 4px;
        border-left: 1px solid var(--border);
        height: 22px;
        top: 10px;
      }
      .row {
        height: var(--row);
        border-bottom: 1px solid var(--border);
      }
      .row:hover .cell,
      .row.hot .cell {
        background: color-mix(in oklab, var(--ink) 3%, var(--surface));
      }
      .row .cell {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
      }
      .code {
        font: 11px var(--font-mono);
        color: var(--dim);
        min-width: 34px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }
      .text {
        min-width: 0;
        flex: 1;
      }
      .title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .parent .title {
        font-weight: 600;
      }
      .sub {
        font: 10px var(--font-mono);
        color: var(--dim);
        display: flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
        overflow: hidden;
      }
      .warn {
        color: var(--danger);
      }
      .chip {
        border: 1px solid color-mix(in oklab, var(--danger) 45%, transparent);
        color: var(--danger);
        background: color-mix(in oklab, var(--danger) 8%, transparent);
        border-radius: 4px;
        padding: 0 5px;
        font: 10px var(--font-mono);
      }
      .line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .line .title {
        flex: 1;
      }
      .fix {
        flex: none;
        border: 1px solid var(--border-bright);
        background: var(--surface);
        border-radius: 4px;
        padding: 0 6px;
        font-size: 11px;
        line-height: 18px;
      }
      .fix:hover {
        background: var(--hover);
      }
      .past {
        position: absolute;
        top: 6px;
        height: 26px;
        border-left: 2px solid var(--danger);
        z-index: 3;
      }
      .past::after {
        content: "past parent";
        position: absolute;
        left: 4px;
        top: 17px;
        font: 9px var(--font-mono);
        color: var(--danger);
        white-space: nowrap;
      }
      .track {
        position: relative;
        flex: none;
      }
      .wk {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px solid var(--border);
      }
      .we {
        position: absolute;
        top: 0;
        bottom: 0;
        background: color-mix(in oklab, var(--ink) 2.5%, transparent);
      }
      .bar {
        position: absolute;
        top: 12px;
        height: 12px;
        border-radius: 3px;
        background: var(--planned);
        border: 1px solid var(--accent);
        cursor: pointer;
        z-index: 2;
      }
      .bar.late {
        background: var(--late);
        border-color: var(--danger);
      }
      .bar.done {
        opacity: 0.75;
      }
      .act {
        position: absolute;
        top: 27px;
        height: 3px;
        border-radius: 2px;
        background: var(--done);
        z-index: 2;
      }
      .sum {
        position: absolute;
        top: 15px;
        height: 6px;
        background: var(--ink);
        border-radius: 1px;
        cursor: pointer;
        z-index: 2;
      }
      .sum::before,
      .sum::after {
        content: "";
        position: absolute;
        top: 0;
        width: 2px;
        height: 11px;
        background: inherit;
      }
      .sum::before {
        left: 0;
      }
      .sum::after {
        right: 0;
      }
      .sum.derived {
        background: transparent;
        border: 1.5px dashed var(--muted);
        height: 7px;
      }
      .sum.derived::before,
      .sum.derived::after {
        background: var(--muted);
        top: -1.5px;
      }
      .ms {
        position: absolute;
        top: 12px;
        width: 13px;
        height: 13px;
        transform: rotate(45deg);
        background: var(--ink);
        border-radius: 2px;
        cursor: pointer;
        z-index: 2;
      }
      .ms.done {
        background: var(--done);
      }
      .picked {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .linking .bar,
      .linking .ms,
      .linking .sum {
        cursor: crosshair;
      }
      svg.arrows {
        position: absolute;
        top: 32px;
        left: var(--label);
        pointer-events: none;
        z-index: 2;
        overflow: visible;
      }
      svg.arrows .line {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.25;
        transition: opacity 0.12s;
      }
      svg.arrows .bad .line {
        stroke: var(--danger);
      }
      svg.arrows .hit {
        fill: none;
        stroke: transparent;
        stroke-width: 10;
        pointer-events: stroke;
        cursor: pointer;
      }
      svg.arrows.focus g {
        opacity: 0.15;
      }
      svg.arrows.focus g.hi {
        opacity: 1;
      }
      svg.arrows.focus g.hi .line {
        stroke-width: 2;
      }
      svg.arrows .tip {
        fill: var(--muted);
      }
      svg.arrows .bad .tip {
        fill: var(--danger);
      }
      svg.arrows .bang {
        fill: var(--danger);
      }
      svg.arrows .bang text {
        fill: var(--surface);
        font: 700 9px var(--font-sans);
      }
      svg.arrows.off {
        display: none;
      }
      .today {
        position: absolute;
        top: 32px;
        bottom: 0;
        border-left: 1.5px dashed var(--ink);
        opacity: 0.55;
        z-index: 1;
        pointer-events: none;
      }
      .legend {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-top: 10px;
        font: 10px var(--font-mono);
        color: var(--dim);
        flex-wrap: wrap;
      }
      .legend i {
        display: inline-block;
        vertical-align: middle;
        margin-right: 5px;
      }
      .pop {
        position: fixed;
        z-index: 10;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-2);
        padding: 10px 12px;
        width: 260px;
        display: none;
      }
      .pop .what {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .pop .kind {
        font: 11px var(--font-mono);
        color: var(--dim);
        margin-bottom: 10px;
      }
      .pop .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pop .danger {
        border: 1px solid color-mix(in oklab, var(--danger) 50%, transparent);
        color: var(--danger);
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 4px 10px;
      }
      .pop .later {
        font-size: 11px;
        color: var(--dim);
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--primary-ink);
        padding: 8px 14px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-2);
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 11;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="crumb">Projects / Customer portal v2 / Todos</div>
      <header>
        <h1>Customer portal v2</h1>
        <div class="seg">
          <span>Table</span><span>Board</span><span class="on">Timeline</span><span>Outline</span
          ><span>Calendar</span><span>List</span>
        </div>
        <button class="primary">New todo</button>
      </header>
      <div class="toolbar">
        <button class="toggle" id="link" aria-pressed="false">＋ Add dependency</button>
        <button class="toggle" id="arrows" aria-pressed="true">Arrows</button>
        <span class="hint" id="hint"></span>
        <span class="meta" id="meta"></span>
      </div>
      <div class="frame">
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend">
        <span
          ><i
            style="
              width: 18px;
              height: 9px;
              background: var(--planned);
              border: 1px solid var(--accent);
              border-radius: 2px;
            "
          ></i
          >planned</span
        >
        <span><i style="width: 18px; height: 3px; background: var(--done)"></i>actual</span>
        <span><i style="width: 18px; height: 5px; background: var(--ink)"></i>summary</span>
        <span
          ><i style="width: 18px; height: 6px; border: 1.5px dashed var(--muted)"></i>from
          sub-issues</span
        >
        <span
          ><i style="width: 9px; height: 9px; background: var(--ink); transform: rotate(45deg)"></i
          >milestone</span
        >
        <span><i style="width: 18px; height: 1px; background: var(--muted)"></i>dependency</span>
        <span><i style="width: 18px; height: 1px; background: var(--danger)"></i>conflict</span>
        <span
          ><i style="width: 0; height: 12px; border-left: 1.5px dashed var(--ink)"></i>today</span
        >
        <span style="margin-left: auto">Oct 26 – Dec 13, 2026</span>
      </div>
    </main>
    <div class="pop" id="pop">
      <div class="what" id="popWhat"></div>
      <div class="kind">finish-to-start</div>
      <div class="actions">
        <button class="danger" id="remove">Remove</button>
        <span class="later">More types later</span>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      const DAY = 864e5;
      const base = Date.UTC(2026, 9, 26);
      const months = { Oct: 9, Nov: 10, Dec: 11 };
      const at = (s) => {
        const [m, d] = s.split(" ");
        return Math.round((Date.UTC(2026, months[m], +d) - base) / DAY);
      };
      const fmt = (i) =>
        new Date(base + i * DAY).toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          timeZone: "UTC",
        });
      const DW = 21;
      const DAYS = 49;
      const ROW = 44;
      const TODAY = at("Nov 15");

      const nodes = [
        { id: "d", code: "1", title: "Discovery", parent: null },
        {
          id: "d1",
          code: "1.1",
          title: "Stakeholder interviews",
          parent: "d",
          who: "Ana Ribeiro",
          status: "done",
          start: at("Oct 26"),
          due: at("Oct 30"),
          act: [at("Oct 26"), at("Oct 31")],
        },
        {
          id: "d2",
          code: "1.2",
          title: "Audit current portal",
          parent: "d",
          who: "Bruno Costa",
          status: "done",
          start: at("Oct 28"),
          due: at("Nov 3"),
          act: [at("Oct 28"), at("Nov 4")],
        },
        {
          id: "d3",
          code: "1.3",
          title: "Requirements sign-off",
          parent: "d",
          who: "Ana Ribeiro",
          status: "done",
          milestone: true,
          start: at("Nov 6"),
          due: at("Nov 6"),
        },
        { id: "g", code: "2", title: "Design", parent: null, own: [at("Nov 2"), at("Nov 20")] },
        {
          id: "g1",
          code: "2.1",
          title: "Information architecture",
          parent: "g",
          who: "Cami Duarte",
          status: "done",
          start: at("Nov 2"),
          due: at("Nov 9"),
          act: [at("Nov 2"), at("Nov 9")],
        },
        {
          id: "g2",
          code: "2.2",
          title: "Wireframes",
          parent: "g",
          who: "Cami Duarte",
          status: "active",
          start: at("Nov 9"),
          due: at("Nov 18"),
          act: [at("Nov 10"), null],
        },
        {
          id: "g3",
          code: "2.3",
          title: "Visual design",
          parent: "g",
          who: "Ana Ribeiro",
          status: "planned",
          start: at("Nov 16"),
          due: at("Nov 24"),
        },
        { id: "b", code: "3", title: "Build", parent: null },
        { id: "b1", code: "3.1", title: "Auth & accounts", parent: "b" },
        {
          id: "b11",
          code: "3.1.1",
          title: "SSO login",
          parent: "b1",
          who: "Bruno Costa",
          status: "active",
          start: at("Nov 10"),
          due: at("Nov 19"),
          act: [at("Nov 10"), null],
        },
        {
          id: "b12",
          code: "3.1.2",
          title: "Account settings",
          parent: "b1",
          who: "Dev User",
          status: "planned",
          start: at("Nov 19"),
          due: at("Nov 26"),
        },
        {
          id: "b2",
          code: "3.2",
          title: "Billing pages",
          parent: "b",
          who: "Bruno Costa",
          status: "planned",
          start: at("Nov 17"),
          due: at("Dec 4"),
        },
        {
          id: "b3",
          code: "3.3",
          title: "API integration",
          parent: "b",
          who: "Cami Duarte",
          status: "blocked",
          start: at("Nov 20"),
          due: at("Dec 2"),
        },
        { id: "l", code: "4", title: "Launch", parent: null },
        {
          id: "l1",
          code: "4.1",
          title: "QA pass",
          parent: "l",
          who: "Ana Ribeiro",
          status: "planned",
          start: at("Dec 4"),
          due: at("Dec 9"),
        },
        {
          id: "l2",
          code: "4.2",
          title: "Go-live",
          parent: "l",
          who: "Dev User",
          status: "planned",
          milestone: true,
          start: at("Dec 10"),
          due: at("Dec 10"),
        },
      ];
      let edges = [
        ["d3", "g2"],
        ["g1", "g2"],
        ["g2", "g3"],
        ["g2", "b2"],
        ["b11", "b12"],
        ["b2", "l1"],
        ["b3", "l1"],
        ["l1", "l2"],
      ];

      const byId = new Map(nodes.map((n) => [n.id, n]));
      const kids = (id) => nodes.filter((n) => n.parent === id);
      const depth = (n) => (n.parent ? depth(byId.get(n.parent)) + 1 : 0);
      const index = new Map(nodes.map((n, i) => [n.id, i]));

      // Planned span: own dates win, otherwise the children's earliest start to latest due.
      function span(n) {
        if (n.own) return { start: n.own[0], due: n.own[1], derived: false };
        const c = kids(n.id);
        if (!c.length) return { start: n.start, due: n.due, derived: false };
        const s = c.map(span);
        return {
          start: Math.min(...s.map((x) => x.start)),
          due: Math.max(...s.map((x) => x.due)),
          derived: true,
        };
      }
      const ancestor = (a, b) => {
        for (let p = byId.get(b).parent; p; p = byId.get(p).parent) if (p === a) return true;
        return false;
      };
      // Finish-to-start: starting on the predecessor's due day is fine, earlier is a conflict.
      const gap = ([f, t]) => span(byId.get(f)).due - span(byId.get(t)).start;
      const bad = (e) => gap(e) > 0;

      // DFS from `from` along successors; returns the path if it reaches `to`.
      function route(from, to, seen = new Set()) {
        if (from === to) return [to];
        if (seen.has(from)) return null;
        seen.add(from);
        for (const [f, t] of edges) {
          if (f !== from) continue;
          const rest = route(t, to, seen);
          if (rest) return [from, ...rest];
        }
        return null;
      }

      const grid = document.getElementById("grid");
      const W = DAYS * DW;
      const x = (i) => i * DW;
      const done = (n) => n.status === "done";
      const color = {
        done: "var(--done)",
        active: "var(--progress)",
        blocked: "var(--danger)",
        planned: "var(--pending)",
      };
      const state = { linking: false, picked: null, arrows: true };

      function render() {
        const parts = [];
        parts.push(
          `<div class="head"><div class="cell">${nodes.filter((n) => !kids(n.id).length).length} todos · tree order</div><div class="weeks" style="width:${W}px">`,
        );
        for (let i = 0; i < DAYS; i += 7)
          parts.push(`<span style="left:${x(i)}px">${fmt(i)}</span>`);
        parts.push(`</div></div>`);
        for (const n of nodes) {
          const s = span(n);
          const parent = kids(n.id).length > 0;
          const pad = depth(n) * 16;
          const conflicts = edges.filter((e) => e[1] === n.id && bad(e));
          let sub = "";
          let fix = "";
          if (parent) {
            const leaves = nodes.filter((m) => !kids(m.id).length && ancestor(n.id, m.id));
            sub = `<span>${leaves.filter(done).length}/${leaves.length} done</span><span>·</span><span>${fmt(s.start)} – ${fmt(s.due)}</span><span>${s.derived ? "from sub-issues" : "own dates"}</span>`;
          } else {
            sub = `<span>${n.who}</span>`;
            if (conflicts.length) {
              const worst = conflicts.reduce((a, b) => (gap(b) > gap(a) ? b : a));
              sub += `<span class="chip">Starts ${gap(worst)}d before ${byId.get(worst[0]).title} is due</span>`;
              fix = `<button class="fix" data-shift="${n.id}" title="Shift after predecessor: start the day after it is due, same duration">Shift</button>`;
            }
          }
          parts.push(
            `<div class="row ${parent ? "parent" : ""}" data-row="${n.id}"><div class="cell"><span class="code" style="padding-left:${pad}px">${n.code}</span>`,
          );
          parts.push(
            parent ? `` : `<span class="dot" style="background:${color[n.status]}"></span>`,
          );
          parts.push(
            `<div class="text"><div class="line"><div class="title">${n.title}</div>${fix}</div><div class="sub">${sub}</div></div></div><div class="track" style="width:${W}px">`,
          );
          for (let i = 0; i < DAYS; i++)
            if (i % 7 === 5)
              parts.push(`<div class="we" style="left:${x(i)}px;width:${DW * 2}px"></div>`);
          for (let i = 7; i < DAYS; i += 7)
            parts.push(`<div class="wk" style="left:${x(i)}px"></div>`);
          const pick = state.picked === n.id ? " picked" : "";
          if (parent) {
            parts.push(
              `<div class="sum${s.derived ? " derived" : ""}${pick}" data-bar="${n.id}" title="${n.title}: ${fmt(s.start)} – ${fmt(s.due)}" style="left:${x(s.start)}px;width:${(s.due - s.start + 1) * DW}px"></div>`,
            );
          } else if (n.milestone) {
            parts.push(
              `<div class="ms${done(n) ? " done" : ""}${pick}" data-bar="${n.id}" title="${n.title}: ${fmt(n.due)}" style="left:${x(n.due) + DW / 2 - 6.5}px"></div>`,
            );
          } else {
            const late = !done(n) && n.due < TODAY;
            parts.push(
              `<div class="bar${late ? " late" : ""}${done(n) ? " done" : ""}${pick}" data-bar="${n.id}" title="${n.title}: ${fmt(n.start)} – ${fmt(n.due)}" style="left:${x(n.start)}px;width:${(n.due - n.start + 1) * DW}px"></div>`,
            );
            const up = n.parent && byId.get(n.parent);
            if (up && up.own && n.due > up.own[1])
              parts.push(
                `<div class="past" title="Due after ${up.title} (${fmt(up.own[1])})" style="left:${x(up.own[1] + 1)}px"></div>`,
              );
            if (n.act) {
              const end = n.act[1] ?? TODAY;
              parts.push(
                `<div class="act" style="left:${x(n.act[0])}px;width:${(end - n.act[0] + 1) * DW}px"></div>`,
              );
            }
          }
          parts.push(`</div></div>`);
        }
        parts.push(
          `<div class="today" style="left:calc(var(--label) + ${x(TODAY) + DW / 2}px)"></div>`,
        );
        parts.push(arrows());
        grid.innerHTML = parts.join("");
        grid.classList.toggle("linking", state.linking);
        const conflicts = edges.filter(bad).length;
        document.getElementById("meta").textContent =
          `${edges.length} dependencies · ${conflicts} conflict${conflicts === 1 ? "" : "s"}`;
      }

      function anchor(id) {
        const n = byId.get(id);
        const s = span(n);
        const y = index.get(id) * ROW + (n.milestone ? 18.5 : 18);
        return {
          y,
          end: x(s.due + 1) + (n.milestone ? -DW / 2 + 7 : 0),
          start: x(s.start) + (n.milestone ? DW / 2 - 7 : 0),
        };
      }

      function arrows() {
        const h = nodes.length * ROW;
        const out = [
          `<svg class="arrows${state.arrows ? "" : " off"}" width="${W}" height="${h}">`,
        ];
        edges.forEach((e, i) => {
          const a = anchor(e[0]);
          const b = anchor(e[1]);
          const x1 = a.end;
          const x2 = b.start;
          const d =
            x2 - x1 >= 14
              ? `M${x1},${a.y} H${x1 + 7} V${b.y} H${x2 - 2}`
              : `M${x1},${a.y} h7 V${b.y - 15} H${x2 - 9} V${b.y} H${x2 - 2}`;
          const conflict = bad(e);
          out.push(
            `<g data-edge="${i}" data-from="${e[0]}" data-to="${e[1]}" class="${conflict ? "bad" : ""}">`,
          );
          out.push(`<path class="line" d="${d}"/><path class="hit" d="${d}"/>`);
          out.push(`<path class="tip" d="M${x2},${b.y} l-6,-3.5 v7 z"/>`);
          if (conflict)
            out.push(
              `<g class="bang"><circle cx="${x1 + 7}" cy="${b.y - 15}" r="6"/><text x="${x1 + 7}" y="${b.y - 12}" text-anchor="middle">!</text></g>`,
            );
          out.push(`</g>`);
        });
        out.push(`</svg>`);
        return out.join("");
      }

      const toast = (msg) => {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => t.classList.remove("show"), 3200);
      };
      const hint = (msg) => (document.getElementById("hint").textContent = msg);

      function link(from, to) {
        const a = byId.get(from).title;
        const b = byId.get(to).title;
        if (from === to) return toast("A todo can't depend on itself");
        if (ancestor(from, to) || ancestor(to, from))
          return toast(
            `${a} and ${b} are in the same branch — parents already contain their sub-issues`,
          );
        if (edges.some((e) => e[0] === from && e[1] === to))
          return toast(`${b} already waits on ${a}`);
        const loop = route(to, from);
        if (loop) {
          const names = [from, ...loop].map((id) => byId.get(id).title);
          return toast(
            `Would create a loop: ${names.length > 4 ? `${names[0]} → … → ${names.at(-2)} → ${names.at(-1)}` : names.join(" → ")}`,
          );
        }
        edges.push([from, to]);
        toast(`${b} now waits on ${a}`);
      }

      grid.addEventListener("click", (ev) => {
        const shift = ev.target.closest("[data-shift]");
        if (shift) {
          const n = byId.get(shift.dataset.shift);
          const after =
            Math.max(...edges.filter((e) => e[1] === n.id).map((e) => span(byId.get(e[0])).due)) +
            1;
          const len = n.due - n.start;
          n.start = after;
          n.due = after + len;
          toast(`${n.title} moved to ${fmt(n.start)} – ${fmt(n.due)}`);
          return render();
        }
        const bar = ev.target.closest("[data-bar]");
        if (state.linking && bar) {
          const id = bar.dataset.bar;
          if (!state.picked) {
            state.picked = id;
            hint(`Pick what waits on ${byId.get(id).title} · Esc to cancel`);
            return render();
          }
          link(state.picked, id);
          state.picked = null;
          hint("Pick the predecessor");
          return render();
        }
      });

      grid.addEventListener("click", (ev) => {
        const g = ev.target.closest("g[data-edge]");
        if (!g || state.linking) return;
        const e = edges[+g.dataset.edge];
        const pop = document.getElementById("pop");
        document.getElementById("popWhat").textContent =
          `${byId.get(e[0]).title} → ${byId.get(e[1]).title}`;
        pop.dataset.edge = g.dataset.edge;
        pop.style.left = `${Math.min(ev.clientX + 8, innerWidth - 280)}px`;
        pop.style.top = `${ev.clientY + 8}px`;
        pop.style.display = "block";
        ev.stopPropagation();
      });

      document.getElementById("remove").addEventListener("click", () => {
        const pop = document.getElementById("pop");
        const e = edges[+pop.dataset.edge];
        edges = edges.filter((_, i) => i !== +pop.dataset.edge);
        pop.style.display = "none";
        toast(`${byId.get(e[1]).title} no longer waits on ${byId.get(e[0]).title}`);
        render();
      });

      document.addEventListener("click", (ev) => {
        const pop = document.getElementById("pop");
        if (!pop.contains(ev.target) && !ev.target.closest("g[data-edge]"))
          pop.style.display = "none";
      });

      grid.addEventListener("mouseover", (ev) => {
        const bar = ev.target.closest("[data-bar]");
        const svg = grid.querySelector("svg.arrows");
        if (!svg) return;
        if (!bar) {
          svg.classList.remove("focus");
          return;
        }
        const id = bar.dataset.bar;
        svg.classList.add("focus");
        svg
          .querySelectorAll("g[data-edge]")
          .forEach((g) => g.classList.toggle("hi", g.dataset.from === id || g.dataset.to === id));
      });

      document.getElementById("link").addEventListener("click", (ev) => {
        state.linking = !state.linking;
        state.picked = null;
        ev.currentTarget.setAttribute("aria-pressed", state.linking);
        hint(state.linking ? "Pick the predecessor" : "");
        render();
      });

      document.getElementById("arrows").addEventListener("click", (ev) => {
        state.arrows = !state.arrows;
        ev.currentTarget.setAttribute("aria-pressed", state.arrows);
        render();
      });

      document.addEventListener("keydown", (ev) => {
        if (ev.key !== "Escape") return;
        document.getElementById("pop").style.display = "none";
        if (!state.linking) return;
        state.linking = false;
        state.picked = null;
        document.getElementById("link").setAttribute("aria-pressed", "false");
        hint("");
        render();
      });

      render();
    </script>
  </body>
</html>
