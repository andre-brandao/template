name: template

# Shared config for the app services that run off the one app image.
x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
    target: runtime
  image: template-app
  env_file: .env
  restart: unless-stopped

# Docker runs one probe per container, so it gets readiness — the question
# `depends_on: service_healthy` asks. `template-cli health <target>` defaults to it and
# resolves the port from the same env var the server binds. `start_period` is the startup probe — a
# failure inside it costs no retry, and the first success ends it. Liveness (`/healthz`)
# has no place to hang here: Docker never restarts a container for going unhealthy.
x-probe: &probe
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # One-shot: `template-cli db migrate` off the app image, then exits.
  migrate:
    <<: *app
    command: ["db", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["serve", "api"]
    environment:
      API_PORT: 3000
      QUEUE_DRIVER: db
    ports:
      - "8080:3000"
    volumes:
      - filedata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *probe
      test: ["CMD", "template-cli", "health", "api"]

  mcp:
    <<: *app
    command: ["serve", "mcp"]
    environment:
      MCP_PORT: 3001
      QUEUE_DRIVER: db
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *probe
      test: ["CMD", "template-cli", "health", "mcp"]

  auth:
    <<: *app
    command: ["serve", "auth"]
    environment:
      PORT: 3002
      # File-backed MemoryStorage so a single-node restart keeps sessions and passwords.
      AUTH_PERSIST: /data/auth.json
    ports:
      - "3002:3002"
    volumes:
      - authdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *probe
      test: ["CMD", "template-cli", "health", "auth"]

  dashboard:
    <<: *app
    command: ["serve", "dashboard"]
    environment:
      PORT: 3000
      QUEUE_DRIVER: db
    ports:
      - "3000:3000"
    volumes:
      - filedata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    healthcheck:
      <<: *probe
      test: ["CMD", "template-cli", "health", "dashboard"]

  # Drains the `job` table that api, mcp and dashboard push to. No port, so no probe.
  queue:
    <<: *app
    entrypoint: ["bun", "run", "packages/functions/src/queue/target/bun.ts"]
    command: []
    environment:
      QUEUE_DRIVER: db
    volumes:
      - filedata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  authdata:
  filedata:
